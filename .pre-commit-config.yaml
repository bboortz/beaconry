# Pre-commit framework — fast gates on commit, test suite on push.
# Install both hook types with:  make install-hooks
#
# On commit  (staged files, fast): ruff + ruff format + pyright
# On push    (full repo):          make check (fast tier — BC-148 2026-11-22)
#                                  + verify-version-bumped + verify-changelog
#                                  + verify-feature-complete
#
# BC-148: pre-push swapped from `check-full` → `check` after 2026-11-22
# observation that Docker-based compose tests inside check-full hit
# Docker Hub rate limits during active sessions. `check` covers lint +
# types + unit tests + all verify-* (BC-016/019/021/040/056/062/069/074).
# The compose + real_tools marker-only suite from `check-full` runs in CI
# (`make check-full` still invoked by workflow on dev push + nightly).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright

  - repo: local
    hooks:
      # BC-148 (2026-11-22): pre-push runs `make check` (fast tier).
      # Covers lint + types + unit + 15+ verify-* scripts + smoke. ~45s
      # typical. Full-tier (`check-full` with compose + real_tools +
      # test-e2e + test-scenarios) stays in CI + nightly — pre-push
      # should be fast enough that developers don't reach for
      # --no-verify routinely. Earlier shape was check-full; replaced
      # after Docker Hub rate-limit observations on 2026-11-22.
      - id: make-check-pre-push
        name: make check (pre-push)
        entry: bash -c 'source .venv/bin/activate && make check'
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-062: refuse pushes that don't bump VERSION. Bypass with
      # BEACONRY_SKIP_VERSION_BUMP=1 only in emergencies.
      - id: verify-version-bumped
        name: verify VERSION bumped (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_version_bumped
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-069: refuse pushes without a CHANGELOG entry for the current
      # VERSION. Bypass with BEACONRY_SKIP_CHANGELOG=1 only in emergencies.
      - id: verify-changelog
        name: verify CHANGELOG entry (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_changelog
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-074: refuse pushes where a shipped story has an incomplete plan.
      # Bypass with BEACONRY_SKIP_FEATURE_COMPLETE=1 only in emergencies.
      - id: verify-feature-complete
        name: verify feature-complete (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_feature_complete
        language: system
        pass_filenames: false
        stages: [pre-push]
