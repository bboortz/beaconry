# Pre-commit framework — fast gates on commit, test suite on push.
# Install both hook types with:  make install-hooks
#
# On commit  (staged files, fast): ruff + ruff format + pyright
# On push    (full repo):          pytest

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright

  - repo: local
    hooks:
      - id: pytest-pre-push
        name: pytest (pre-push)
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: verify-traceability-pre-push
        name: verify-traceability (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_traceability
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-062: refuse pushes that don't bump VERSION. Bypass with
      # BEACONRY_SKIP_VERSION_BUMP=1 only in emergencies.
      - id: verify-version-bumped
        name: verify VERSION bumped (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_version_bumped
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-069: refuse pushes without a CHANGELOG entry for the current
      # VERSION. Bypass with BEACONRY_SKIP_CHANGELOG=1 only in emergencies.
      - id: verify-changelog
        name: verify CHANGELOG entry (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_changelog
        language: system
        pass_filenames: false
        stages: [pre-push]
