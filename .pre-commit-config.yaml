# Pre-commit framework — fast gates on commit, test suite on push.
# Install both hook types with:  make install-hooks
#
# On commit  (staged files, fast): ruff + ruff format + pyright
# On push    (full repo):          make check-full (BC-079 — container verification)
#                                  + verify-version-bumped + verify-changelog
#                                  + verify-feature-complete

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright

  - repo: local
    hooks:
      # BC-079: full container verification on pre-push. Includes pytest
      # (fast tier) + compose + real_tools + test-e2e + test-scenarios.
      # CLI-smoke is skipped because it requires a live operator stack the
      # developer may not have running. Takes ~2:30 locally; bypass with
      # --no-verify only in emergencies.
      - id: make-check-full-pre-push
        name: make check-full (pre-push)
        entry: bash -c 'source .venv/bin/activate && BEACONRY_SKIP_CLI_SMOKE=1 make check-full'
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-062: refuse pushes that don't bump VERSION. Bypass with
      # BEACONRY_SKIP_VERSION_BUMP=1 only in emergencies.
      - id: verify-version-bumped
        name: verify VERSION bumped (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_version_bumped
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-069: refuse pushes without a CHANGELOG entry for the current
      # VERSION. Bypass with BEACONRY_SKIP_CHANGELOG=1 only in emergencies.
      - id: verify-changelog
        name: verify CHANGELOG entry (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_changelog
        language: system
        pass_filenames: false
        stages: [pre-push]
      # BC-074: refuse pushes where a shipped story has an incomplete plan.
      # Bypass with BEACONRY_SKIP_FEATURE_COMPLETE=1 only in emergencies.
      - id: verify-feature-complete
        name: verify feature-complete (pre-push)
        entry: .venv/bin/python -m poc.scripts.verify_feature_complete
        language: system
        pass_filenames: false
        stages: [pre-push]
