# BC-017 — nginx config for probe-target-test container.
# Routes let tests exercise HTTP probe success + failure paths.

server {
    listen 80 default_server;
    server_name _;

    # Success path: BC-011 HTTP probe → 200 OK.
    location = /healthy {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Failure path: BC-011 HTTP probe → 503 Service Unavailable.
    location = /degraded {
        add_header Content-Type text/plain;
        return 503 "degraded\n";
    }

    # Everything else returns 404 (also a probe failure).
    location / {
        return 404 "nothing here\n";
    }
}
