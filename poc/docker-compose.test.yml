---
# BC-018 — isolated test compose stack. Three services:
#   - beaconry-hub-test — same beaconry-hub:latest image, zero test code (BC-018)
#   - telegram-mock     — mini Telegram Bot API shim + /__driver__/* endpoints
#   - probe-target-test — nginx serving /healthy (200) + /degraded (503)
#
# Hub-test's python-telegram-bot client points at telegram-mock via
# BEACONRY_TELEGRAM_BASE_URL. Hub runs its real production code path.
# Project name `beaconry-test` + container names + port 9000/9080 keep this
# stack co-existing with the operator's normal `beaconry-hub` stack.
name: beaconry-test

services:
  beaconry-hub-test:
    build:
      context: ./
      dockerfile: hub/Dockerfile
    image: beaconry-hub:latest
    container_name: beaconry-hub-test
    environment:
      - BEACONRY_SKIP_GRYPE_DB=1   # skip the ~90s grype DB download
      - BEACONRY_FIX_ENABLED=1
      - BEACONRY_HEALTH_PROBES=postgres:latest=http:http://probe-target-test:80/healthy;postgres:16-alpine=http:http://probe-target-test:80/healthy;postgres:16.1.3-alpine=http:http://probe-target-test:80/healthy;nginx:1.24=http:http://probe-target-test:80/degraded;nginxproxy/nginx-proxy:alpine=http:http://probe-target-test:80/healthy
      - GRYPE_DB_CACHE_DIR=/data/grype-db
      - TELEGRAM_BOT_TOKEN=test-token-1234567890
      - TELEGRAM_CHAT_ID=0
      # BC-018: point python-telegram-bot at the mock service instead of api.telegram.org.
      - BEACONRY_TELEGRAM_BASE_URL=http://telegram-mock:8080
    volumes:
      - beaconry-test-data:/data
    ports:
      - "127.0.0.1:9000:8000"
    depends_on:
      telegram-mock:
        condition: service_started
      probe-target-test:
        condition: service_started

  telegram-mock:
    build:
      context: ./
      dockerfile: telegram_mock/Dockerfile
    container_name: telegram-mock
    ports:
      # Driver endpoints exposed to the host test runner.
      - "127.0.0.1:9080:8080"

  probe-target-test:
    image: nginx:alpine
    container_name: probe-target-test
    volumes:
      - ./tests/e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  beaconry-test-data:
