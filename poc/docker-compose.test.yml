---
# BC-017 — isolated test compose stack for end-to-end BC-011 probe flow tests.
# Separate project name (`beaconry-test`), network (`beaconry-test`), volume
# (`beaconry-test-data`), and container names (`-test` suffix) ensure this
# stack co-exists with the operator's normal `beaconry-hub` / `beaconry-scout`
# without collision. Hub bound to 127.0.0.1:9000 instead of 8000.
name: beaconry-test

services:
  beaconry-hub-test:
    build:
      context: ./
      dockerfile: hub/Dockerfile
    image: beaconry-hub:latest
    container_name: beaconry-hub-test
    environment:
      - BEACONRY_MOCK=1           # skip grype DB download + Telegram wiring
      - BEACONRY_TEST_MODE=1      # enables /__test__/* endpoints (hard-gated)
      - BEACONRY_FIX_ENABLED=1
      - BEACONRY_HEALTH_PROBES=postgres:latest=http:http://probe-target-test:80/healthy;postgres:16-alpine=http:http://probe-target-test:80/healthy;postgres:16.1.3-alpine=http:http://probe-target-test:80/healthy;nginx:1.24=http:http://probe-target-test:80/degraded;nginxproxy/nginx-proxy:alpine=http:http://probe-target-test:80/healthy
      - GRYPE_DB_CACHE_DIR=/data/grype-db
      - TELEGRAM_BOT_TOKEN=test-token-not-used
      - TELEGRAM_CHAT_ID=0
    volumes:
      - beaconry-test-data:/data
    ports:
      - "127.0.0.1:9000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 10s
      start_interval: 1s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      probe-target-test:
        condition: service_started

  probe-target-test:
    image: nginx:alpine
    container_name: probe-target-test
    volumes:
      - ./tests/e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx:alpine lacks curl/wget; rely on `service_started` instead of a
    # health probe. The hub-test's own readyz loop in make test-e2e waits
    # for the full stack to be reachable.

volumes:
  beaconry-test-data:
