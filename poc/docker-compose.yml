---
services:
  hub:
    build:
      context: ./
      dockerfile: hub/Dockerfile
    image: beaconry-hub:latest
    # BC-078: distroless runtime has no shell → no in-image groupadd. The
    # non-root user joins the host's docker-socket group via compose
    # `group_add` at runtime instead. Change gid in .env without rebuild.
    # Default 999 matches Debian/Ubuntu; Fedora 995, Arch 989, Alpine 412.
    group_add:
      - "${DOCKER_GID:-999}"
    # BC-101: dev stack namespaced as `beaconry-dev-*` to avoid colliding
    # with the operator systemd stack (`beaconry-scout.service` wraps
    # `docker-compose.scout-only.yml` which keeps the unqualified name).
    container_name: beaconry-dev-hub
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GRYPE_DB_CACHE_DIR=/data/grype-db
      - MIN_CVSS=${MIN_CVSS:-9.0}
      - BEACONRY_MAX_FINDINGS_PER_RUN=${BEACONRY_MAX_FINDINGS_PER_RUN:-5}
      # BC-009: fix execution opt-in flag; default on
      - BEACONRY_FIX_ENABLED=${BEACONRY_FIX_ENABLED:-1}
      # BC-066: which executor handles [Fix now]. manual = log + remind;
      # docker = auto-pull. Default manual (safe on arbitrary infra).
      - BEACONRY_EXECUTOR=${BEACONRY_EXECUTOR:-}
      - BEACONRY_MANUAL_REMINDER_INTERVAL_S=${BEACONRY_MANUAL_REMINDER_INTERVAL_S:-}
      # BC-011: policy-driven probe resolver
      - BEACONRY_HEALTH_PROBES=${BEACONRY_HEALTH_PROBES:-}
      # BC-020: optional override of the CISA KEV feed URL (air-gapped setups)
      - BEACONRY_KEV_FEED_URL=${BEACONRY_KEV_FEED_URL:-}
      # BC-091: override the User-Agent sent to CISA; default is
      # auto-generated `beaconry/<version> (+repo)`. CISA 403'd the
      # pre-BC-091 hardcoded UA on anonymous requests.
      - BEACONRY_KEV_USER_AGENT=${BEACONRY_KEV_USER_AGENT:-}
      # BC-092: canary-ring gate on production fixes.
      - BEACONRY_CANARY_RING_ENABLED=${BEACONRY_CANARY_RING_ENABLED:-1}
      - BEACONRY_CANARY_PRODUCTION_FORCE_ALLOW=${BEACONRY_CANARY_PRODUCTION_FORCE_ALLOW:-0}
      # BC-031: scan reconciliation (fix-is-not-forget). Default on; set to 0
      # to disable the long-term diff for privacy/surveillance-conscious setups.
      - BEACONRY_RECONCILE_ENABLED=${BEACONRY_RECONCILE_ENABLED:-1}
      # BC-086: consecutive absent scans before an open/snoozed/accepted/regressed
      # finding flips to `auto_fixed`. Default 3; set to 1 to reproduce pre-BC-086 behaviour.
      - BEACONRY_AUTO_FIX_THRESHOLD=${BEACONRY_AUTO_FIX_THRESHOLD:-3}
      # BC-102: scout-offline detection + reconcile.
      - BEACONRY_SCOUT_OFFLINE_ALERT_THRESHOLD_S=${BEACONRY_SCOUT_OFFLINE_ALERT_THRESHOLD_S:-600}
      - BEACONRY_SCOUT_OFFLINE_SWEEP_INTERVAL_S=${BEACONRY_SCOUT_OFFLINE_SWEEP_INTERVAL_S:-60}
      - BEACONRY_AUTO_CLOSE_STALE_SCOUT=${BEACONRY_AUTO_CLOSE_STALE_SCOUT:-1}
      # BC-104: notification retry queue.
      - BEACONRY_NOTIFY_RETRY_MAX_ATTEMPTS=${BEACONRY_NOTIFY_RETRY_MAX_ATTEMPTS:-5}
      - BEACONRY_NOTIFY_RETRY_BASE_S=${BEACONRY_NOTIFY_RETRY_BASE_S:-30}
      - BEACONRY_NOTIFY_RETRY_SWEEP_INTERVAL_S=${BEACONRY_NOTIFY_RETRY_SWEEP_INTERVAL_S:-60}
      # BC-106: partial-inventory guard. Skip reconcile when scout reports
      # collected/expected < ratio. 0 disables; BC-067 baseline is fallback.
      - BEACONRY_PARTIAL_SCAN_MIN_RATIO=${BEACONRY_PARTIAL_SCAN_MIN_RATIO:-0.95}
      # BC-089: snooze buttons + sweep.
      - BEACONRY_SNOOZE_DEFAULT_HOURS=${BEACONRY_SNOOZE_DEFAULT_HOURS:-1,4,24,168}
      - BEACONRY_SNOOZE_SWEEP_INTERVAL_S=${BEACONRY_SNOOZE_SWEEP_INTERVAL_S:-60}
      - BEACONRY_SNOOZE_NOTIFY_ON_EXPIRE=${BEACONRY_SNOOZE_NOTIFY_ON_EXPIRE:-1}
      # BC-090: distinct auto-fix regression body + per-kind silence knob.
      - BEACONRY_AUTO_FIX_REGRESSION_NOTIFY_ENABLED=${BEACONRY_AUTO_FIX_REGRESSION_NOTIFY_ENABLED:-1}
      # BC-087: root log level for hub (DEBUG|INFO|WARNING|ERROR|CRITICAL).
      # DEBUG re-enables BC-086's reconcile + bump_last_seen diagnostic trace.
      - BEACONRY_LOG_LEVEL=${BEACONRY_LOG_LEVEL:-INFO}
      # BC-030: internet-facing detection. Default on; set to 0 to force all
      # findings to Tier 2 regardless of container port publication.
      - BEACONRY_INTERNET_FACING_DETECTION_ENABLED=${BEACONRY_INTERNET_FACING_DETECTION_ENABLED:-1}
      # BC-035: periodic reminder for stale open findings. Default on.
      - BEACONRY_HEARTBEAT_ENABLED=${BEACONRY_HEARTBEAT_ENABLED:-1}
      - BEACONRY_HEARTBEAT_INTERVAL_S=${BEACONRY_HEARTBEAT_INTERVAL_S:-}
      - BEACONRY_HEARTBEAT_SWEEP_INTERVAL_S=${BEACONRY_HEARTBEAT_SWEEP_INTERVAL_S:-}
      - BEACONRY_HEARTBEAT_LIVENESS_WINDOW_S=${BEACONRY_HEARTBEAT_LIVENESS_WINDOW_S:-}
      # BC-036: digest cadence. Default 24h; 0 = never throttle (every scan).
      - BEACONRY_DIGEST_INTERVAL_S=${BEACONRY_DIGEST_INTERVAL_S:-}
      # BC-065: hash-change digest bypass. 0 → make DIGEST_INTERVAL_S a strict floor.
      - BEACONRY_DIGEST_ON_CONTENT_CHANGE=${BEACONRY_DIGEST_ON_CONTENT_CHANGE:-}
      # BC-061: fleet liveness thresholds.
      - BEACONRY_FLEET_ACTIVE_WINDOW_S=${BEACONRY_FLEET_ACTIVE_WINDOW_S:-600}
      - BEACONRY_FLEET_DEAD_AFTER_S=${BEACONRY_FLEET_DEAD_AFTER_S:-86400}
      # BC-062: strict API-version gate. Soft default (empty/0) warns on
      # X-Beaconry-API-Expect mismatch; 1 → 412 Precondition Failed.
      - BEACONRY_STRICT_API=${BEACONRY_STRICT_API:-}
      # BC-035: per-adapter enable toggles. Future adapters each get their own.
      - BEACONRY_NOTIFIER_TELEGRAM_ENABLED=${BEACONRY_NOTIFIER_TELEGRAM_ENABLED:-1}
      # BEACONRY_MOCK is dev-mode; opt-in via explicit env
      - BEACONRY_MOCK=${BEACONRY_MOCK:-}
      # BC-038: /test/* routes gate. Default empty = routes NOT registered.
      # DO NOT set to 1 in production operator stacks.
      - BEACONRY_TEST_MODE=${BEACONRY_TEST_MODE:-}
      # BC-055: separate bearer tokens for scout → hub ingest vs CLI → hub
      # management. Independent blast radius: scout token leak doesn't
      # compromise the operator surface. Both empty = auth disabled.
      - HUB_SCOUT_TOKEN=${HUB_SCOUT_TOKEN:-}
      - HUB_CLI_TOKEN=${HUB_CLI_TOKEN:-}
      # BC-055: hub reads its own publish addr to warn on unauthenticated LAN exposure.
      - HUB_PUBLISH_ADDR=${HUB_PUBLISH_ADDR:-127.0.0.1}
    volumes:
      - beaconry-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HUB_PUBLISH_ADDR:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "/hc", "-t", "3", "http://localhost:8000/readyz"]
      interval: 60s
      start_interval: 2s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scout:
    build:
      context: ./
      dockerfile: scout/Dockerfile
    image: beaconry-scout:latest
    # BC-078: see hub group_add. Scout touches the Docker socket read-only
    # via `docker events` + `docker ps` for inventory.
    group_add:
      - "${DOCKER_GID:-999}"
    # BC-101: dev stack namespaced (see hub).
    container_name: beaconry-dev-scout
    restart: unless-stopped
    environment:
      - HUB_URL=http://hub:8000
      - HOST_NAME=${HOST_NAME:-server2}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-300}
      # BC-063: short-interval keepalive so FLEET's HEALTH/VERSION cells stay
      # fresh. Set to 0 to disable.
      - SCOUT_HEARTBEAT_INTERVAL_S=${SCOUT_HEARTBEAT_INTERVAL_S:-60}
      # BC-075: metrics opt-in. 0 = scout stays out of beaconry metrics
      # (privacy-first default). 1 = opt in; hub records metrics-fuel
      # audit events for this scout.
      - SCOUT_METRICS_ENABLED=${SCOUT_METRICS_ENABLED:-0}
      - SCOUT_INCLUDE=${SCOUT_INCLUDE:-nginx*,redis*,postgres*}
      - SCOUT_EXCLUDE=${SCOUT_EXCLUDE:-}
      - PACMAN_DB=/host/var/lib/pacman
      # BC-055: scout sends this on POST /scan. Must match hub's HUB_SCOUT_TOKEN.
      - HUB_TOKEN=${HUB_TOKEN:-${HUB_SCOUT_TOKEN:-}}
      # BC-087: shared knob with hub — same value controls scout's root logger.
      - BEACONRY_LOG_LEVEL=${BEACONRY_LOG_LEVEL:-INFO}
      # BC-092: canary-ring role (workstation|staging|production). Scout
      # advertises on heartbeat + /scan; hub uses it to gate production fixes.
      - SCOUT_HOST_ROLE=${SCOUT_HOST_ROLE:-workstation}
      # BC-093: rescan triggers beyond SCAN_INTERVAL.
      - BEACONRY_DAILY_RESCAN_HOUR=${BEACONRY_DAILY_RESCAN_HOUR:-2}
      - BEACONRY_DOCKER_EVENTS_ENABLED=${BEACONRY_DOCKER_EVENTS_ENABLED:-1}
      - BEACONRY_DOCKER_EVENTS_DEBOUNCE_S=${BEACONRY_DOCKER_EVENTS_DEBOUNCE_S:-10}
      # BC-107: scout-side persistent retry queue for failed /scan POSTs.
      # Mirrors BC-104 on the hub side. Pre-BC-107 a transient hub outage
      # silently lost that cycle's SBOM; now we persist + replay.
      - BEACONRY_SCOUT_POST_RETRY_MAX_ATTEMPTS=${BEACONRY_SCOUT_POST_RETRY_MAX_ATTEMPTS:-5}
      - BEACONRY_SCOUT_POST_RETRY_BASE_S=${BEACONRY_SCOUT_POST_RETRY_BASE_S:-30}
      - BEACONRY_SCOUT_POST_RETRY_SWEEP_INTERVAL_S=${BEACONRY_SCOUT_POST_RETRY_SWEEP_INTERVAL_S:-60}
      - BEACONRY_SCOUT_STATE_DB=${BEACONRY_SCOUT_STATE_DB:-/data/scout-state.db}
      # BC-108: wrap docker events listener in reconnect loop with capped
      # exponential backoff so daemon restart doesn't silently kill it.
      - BEACONRY_DOCKER_EVENTS_BACKOFF_MIN_S=${BEACONRY_DOCKER_EVENTS_BACKOFF_MIN_S:-1}
      - BEACONRY_DOCKER_EVENTS_BACKOFF_MAX_S=${BEACONRY_DOCKER_EVENTS_BACKOFF_MAX_S:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/pacman:/host/var/lib/pacman:ro
      - beaconry-data:/data
    ports:
      # BC-101: host port 18001 (not 8001) so the dev stack coexists with
      # the operator systemd scout (docker-compose.scout-only.yml uses
      # network_mode: host and binds 0.0.0.0:8001 directly). Container
      # internal port is still 8001.
      - "127.0.0.1:18001:8001"
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/hc", "-t", "3", "http://localhost:8001/readyz"]
      interval: 60s
      start_interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  beaconry-data:
