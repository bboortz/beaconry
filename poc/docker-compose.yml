---
services:
  hub:
    build:
      context: ./
      dockerfile: hub/Dockerfile
    image: beaconry-hub:latest
    container_name: beaconry-hub
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GRYPE_DB_CACHE_DIR=/data/grype-db
      - MIN_CVSS=${MIN_CVSS:-9.0}
      - BEACONRY_MAX_FINDINGS_PER_RUN=${BEACONRY_MAX_FINDINGS_PER_RUN:-5}
      # BC-009: fix execution opt-in flag; default on
      - BEACONRY_FIX_ENABLED=${BEACONRY_FIX_ENABLED:-1}
      # BC-011: policy-driven probe resolver
      - BEACONRY_HEALTH_PROBES=${BEACONRY_HEALTH_PROBES:-}
      # BC-020: optional override of the CISA KEV feed URL (air-gapped setups)
      - BEACONRY_KEV_FEED_URL=${BEACONRY_KEV_FEED_URL:-}
      # BC-031: scan reconciliation (fix-is-not-forget). Default on; set to 0
      # to disable the long-term diff for privacy/surveillance-conscious setups.
      - BEACONRY_RECONCILE_ENABLED=${BEACONRY_RECONCILE_ENABLED:-1}
      # BC-030: internet-facing detection. Default on; set to 0 to force all
      # findings to Tier 2 regardless of container port publication.
      - BEACONRY_INTERNET_FACING_DETECTION_ENABLED=${BEACONRY_INTERNET_FACING_DETECTION_ENABLED:-1}
      # BC-035: periodic reminder for stale open findings. Default on.
      - BEACONRY_HEARTBEAT_ENABLED=${BEACONRY_HEARTBEAT_ENABLED:-1}
      - BEACONRY_HEARTBEAT_INTERVAL_S=${BEACONRY_HEARTBEAT_INTERVAL_S:-}
      - BEACONRY_HEARTBEAT_SWEEP_INTERVAL_S=${BEACONRY_HEARTBEAT_SWEEP_INTERVAL_S:-}
      - BEACONRY_HEARTBEAT_LIVENESS_WINDOW_S=${BEACONRY_HEARTBEAT_LIVENESS_WINDOW_S:-}
      # BC-036: digest cadence. Default 24h; 0 = never throttle (every scan).
      - BEACONRY_DIGEST_INTERVAL_S=${BEACONRY_DIGEST_INTERVAL_S:-}
      # BC-061: fleet liveness thresholds.
      - BEACONRY_FLEET_ACTIVE_WINDOW_S=${BEACONRY_FLEET_ACTIVE_WINDOW_S:-600}
      - BEACONRY_FLEET_DEAD_AFTER_S=${BEACONRY_FLEET_DEAD_AFTER_S:-86400}
      # BC-062: strict API-version gate. Soft default (empty/0) warns on
      # X-Beaconry-API-Expect mismatch; 1 → 412 Precondition Failed.
      - BEACONRY_STRICT_API=${BEACONRY_STRICT_API:-}
      # BC-035: per-adapter enable toggles. Future adapters each get their own.
      - BEACONRY_NOTIFIER_TELEGRAM_ENABLED=${BEACONRY_NOTIFIER_TELEGRAM_ENABLED:-1}
      # BEACONRY_MOCK is dev-mode; opt-in via explicit env
      - BEACONRY_MOCK=${BEACONRY_MOCK:-}
      # BC-038: /test/* routes gate. Default empty = routes NOT registered.
      # DO NOT set to 1 in production operator stacks.
      - BEACONRY_TEST_MODE=${BEACONRY_TEST_MODE:-}
      # BC-055: separate bearer tokens for scout → hub ingest vs CLI → hub
      # management. Independent blast radius: scout token leak doesn't
      # compromise the operator surface. Both empty = auth disabled.
      - HUB_SCOUT_TOKEN=${HUB_SCOUT_TOKEN:-}
      - HUB_CLI_TOKEN=${HUB_CLI_TOKEN:-}
      # BC-055: hub reads its own publish addr to warn on unauthenticated LAN exposure.
      - HUB_PUBLISH_ADDR=${HUB_PUBLISH_ADDR:-127.0.0.1}
    volumes:
      - beaconry-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HUB_PUBLISH_ADDR:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 60s
      start_interval: 2s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scout:
    build:
      context: ./
      dockerfile: scout/Dockerfile
    image: beaconry-scout:latest
    container_name: beaconry-scout
    restart: unless-stopped
    environment:
      - HUB_URL=http://hub:8000
      - HOST_NAME=${HOST_NAME:-server2}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-300}
      # BC-063: short-interval keepalive so FLEET's HEALTH/VERSION cells stay
      # fresh. Set to 0 to disable.
      - SCOUT_HEARTBEAT_INTERVAL_S=${SCOUT_HEARTBEAT_INTERVAL_S:-60}
      - SCOUT_INCLUDE=${SCOUT_INCLUDE:-nginx*,redis*,postgres*}
      - SCOUT_EXCLUDE=${SCOUT_EXCLUDE:-}
      - PACMAN_DB=/host/var/lib/pacman
      # BC-055: scout sends this on POST /scan. Must match hub's HUB_SCOUT_TOKEN.
      - HUB_TOKEN=${HUB_TOKEN:-${HUB_SCOUT_TOKEN:-}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/pacman:/host/var/lib/pacman:ro
      - beaconry-data:/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/readyz').status==200 else 1)"]
      interval: 60s
      start_interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  beaconry-data:
