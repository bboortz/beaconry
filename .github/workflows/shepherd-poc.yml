---
# Shepherd caller (SH-007 R1-A). Replaced the R0 copied-scripts flow with
# a thin uses: of bboortz/shepherd's reusable workflow. SHA-pinned to the
# commit that shipped v0.5.0-rc1.
name: shepherd
"on":
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  agent:
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd.yml@7304593d5504f4cdfd0a63816cddc066999ed419
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
