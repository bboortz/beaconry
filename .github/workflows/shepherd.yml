---
# Shepherd caller (SH-007). Requires .shepherd.yml + ANTHROPIC_API_KEY.
name: shepherd
"on":
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  # needs-human escalation when regen-lockfile can't salvage an agent
  # diff. Mirrors the reusable workflow's declared permissions —
  # otherwise GitHub rejects the dispatch with 'workflow file issue'.
  issues: write
jobs:
  agent:
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd.yml@d60e728ff5f6f546d251e9ef9dce741d221c1ee9
    with:
      base_branch: dev
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
