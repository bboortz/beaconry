---
# Shepherd caller (SH-007). Requires .shepherd.yml + ANTHROPIC_API_KEY.
name: shepherd
"on":
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  agent:
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd.yml@404eafa3a0dc9f1f5530028c9ea685f7f2b4b0ef
    with:
      base_branch: dev
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
