---
# Dev-cycle contract (SH-014) — tier 2: patch-after-merge on dev/main.
# Budget: 5 minutes wall-clock. NEVER rebuilds; re-smokes the ci-branch
# artifact keyed by commit SHA.
#
# Copy this file to .github/workflows/ci-patch.yml in your managed repo.
#
# Spec: docs/specs/dev-cycle-contract.md
name: ci-patch

"on":
  push:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5    # hard budget cap (SH-014).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # `make smoke` runs `python -m poc.demo` which imports `hub` →
          # `uvicorn`/`fastapi` (hub requirements) and `scout` modules too.
          # Install both component requirements files so the mock smoke run
          # can import them on the host.
          pip install -r poc/hub/requirements.txt
          pip install -r poc/scout/requirements.txt
          # Also install the package itself so operator-CLI entry points
          # (poc.scripts.*) + pyproject deps (pyyaml, requests) resolve.
          pip install -e .

      # Build-once-promote (SH-014): download the artifact produced by
      # ci-branch at ${{ github.sha }}. If the artifact is missing (eg. a
      # fresh branch with no prior PR), the step soft-fails and `make smoke`
      # runs against the current checkout. For image repos, override `smoke`
      # to `docker pull ghcr.io/<repo>:sha-<commit>` instead.
      - name: Download release artifacts from ci-branch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sha-${{ github.sha }}
          path: build/release/

      - name: Run patch-tier gate
        run: make ci-patch

      - name: Upload ci-timing.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-timing-patch
          path: build/ci-timing.json
          if-no-files-found: ignore
