[project]
name = "beaconry"
# BC-062: VERSION file is the single source of truth; this literal is only
# a build-time placeholder (setuptools-dynamic would rebuild on every bump,
# which is more friction than value). verify-version-sync lint catches drift.
version = "0.10.1"
description = "CVE scanning + auto-remediation for self-hosted operators"
# BC-078: distroless runtime image ships Python 3.11 (debian-12 default).
# Local dev + CI can still use 3.12; the floor just permits the runtime.
requires-python = ">=3.11"
dependencies = [
    # BC-070: operator CLI (`beaconry status` / `beaconry findings` / …) uses:
    "pyyaml>=6.0",     # CliConfig reads ~/.config/beaconry/cli.yml
    "requests>=2.31",  # scout + CLI HTTP paths
]

# BC-070: register the operator CLI entry point. `pip install -e .` makes
# `beaconry` available on $PATH; dispatches to the per-command scripts
# in poc/scripts/.
[project.scripts]
beaconry = "poc.scripts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit list bypasses setuptools flat-layout detection (which fires when
# multiple top-level dirs exist — poc/ + memory/) before the include filter
# is applied. This is equivalent to the old find with include=["poc*"] minus
# test/scenario packages.
[tool.setuptools]
packages = [
    "poc",
    "poc.beaconry_health",
    "poc.hub.executor",
    "poc.hub.notifiers",
    "poc.scout",
    "poc.scripts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["OLD"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    # Complexity gates (BC-coverage-and-complexity): slightly looser than
    # defaults so existing hub.py doesn't fail — the point is to catch new
    # offenders, not force a mass refactor of shipped code.
    "C901",   # cyclomatic complexity
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
]
ignore = [
    "E501",   # line length handled by ruff format
]

[tool.ruff.lint.mccabe]
max-complexity = 12  # default 10; +2 slack for existing shipped code

[tool.ruff.lint.pylint]
max-branches = 15     # default 12
max-args = 7          # default 5
max-statements = 60   # default 50

# Test files legitimately have high complexity (parametrize matrices,
# scenario fixtures). Disable complexity gates there.
[tool.ruff.lint.per-file-ignores]
"poc/tests/**/*.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["poc"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "OLD",
]
# poc/hub is on sys.path at runtime (hub.py uses `from executor.base import ...`
# and demo.py adds it via sys.path.insert); mirror that for static analysis.
extraPaths = ["poc/hub"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["poc/tests"]
pythonpath = [".", "poc/hub"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "real_tools: opt-in; requires syft + grype on $PATH and nginx:1.24 pulled",
    "compose: opt-in; requires docker + docker compose available",
    "e2e: opt-in; requires BC-017 test compose stack up (`make test-e2e` orchestrates)",
    "cold_start: opt-in; requires BC-082 cold-start compose stack up (`make test-cold-start` orchestrates)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=poc",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-config=pyproject.toml",
    "-m", "not real_tools and not compose and not e2e and not cold_start",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.coverage.run]
source = ["poc"]
omit = [
    "poc/tests/*",
    "poc/*/Dockerfile",
    # Integration-shell modules: interactive main loops where pytest-cov
    # metrics would require fake-mocking without correctness value.
    "poc/demo.py",              # interactive mock-pipeline orchestrator
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
# Global coverage floor. Lifted from 60 → 85 as part of chore/complexity-gates
# (2026-10-31) alongside complexity rules and a per-file 65% floor. Review 2026-11-28.
fail_under = 85
